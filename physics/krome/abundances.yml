---
# Abundances for the default chemical network.
# Set the initial abundances of chemical species of interest.
# Key in the species and their respective number densities [1/cm3] or mass fractions [X]

num_dens_abundances:
  H   : 9.e+1
  H+  : 1.e-2
  H2  : 9.e+0
  C+  : 1.4e-2
  C   : 1.e-3
  CO  : 1.e-4
  OH  : 1.e-5
  O   : 3.2e-2
  E   : 1.5e-2

mass_frac_abundances:
  H   : 9.e-1
  H+  : 1.e-4
  H2  : 9.e-2
  C+  : 1.4e-4
  C   : 1.e-5
  CO  : 1.e-6
  OH  : 1.e-7
  O   : 3.2e-4
  E   : 1.5e-4
...
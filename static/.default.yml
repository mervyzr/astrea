---
physics_parameters:
  # List of available configurations to run (spaces are hyphenated)
  # : Blank field, Sod, (MHD) Sedov, Gaussian, sine wave, Shu-Osher (SO), Ryu-Jones (RJ), Brio-Wu (BW), slow-moving shock, Toro 1-5, 
  # : isentropic vortex (IVC), (MHD) Lax-Liu (LL) 1-19, Gresho vortex, Noh problem, (MHD) Kelvin-Helmholtz instability (KHI), 
  # : circular polarised Alfvén wave (CPAW), MHD blast, MHD rotor, MHD blob, MHD sheet, MHD vortex, Orszag-Tang vortex, 
  # : shock cloud, astrophysical jet
  config        : Sod
  cells         : 128
  cfl           : .5
  gamma         : 1.4
  dimensions    : 1

numerical_parameters:
  # Floating-point precision : float16, float32, float64
  precision     : float64
  # Subgrid models for hydro and mag. components : PCM, PLM, PPM, CWENO, WENO-3/5/7
  subgrid       : PCM
  # Iteration methods : EULER, RK4, SSPRK(2,2), SSPRK(3,3), SSPRK(4,3), SSPRK(5,3), SSPRK(5,4), SSPRK(10,4), SSPRK(6,5)
  time_evo      : EULER
  # Update schemes : Lax-Friedrich (LF), Lax-Wendroff (LW), GFORCE (G), HLL, HLLC (C), HLLD (D), Osher-Solomon (OS)
  solver        : LF

runtime_parameters:
  checkpoints   : 1
  live_plot     : false
  save_snaps    : false
  save_plots    : false
  save_video    : false
  save_file     : false
  plot_style    : default
  # Plot options
  # : density, pressure, velocity Vx/Vy/Vz, total/internal energy, Mach number,
  # : magnetic field Bx/By/Bz, magnetic pressure, magnetic divergence divB
  plot_options  :
    - density
    - pressure
    - vx
    - total energy
...